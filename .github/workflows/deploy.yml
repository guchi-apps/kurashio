name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump frontend/package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      DB_ADMIN_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_ADMIN_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      HOST: ${{ secrets.SERVER_HOST }}
      SHARED_TOKEN_API_URL: ${{ vars.APP_BASE_URL }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      AIRCON_EMAIL: ${{ secrets.AIRCON_EMAIL }}
      AIRCON_PASSWORD: ${{ secrets.AIRCON_PASSWORD }}
      CLEANING_NOTION_DATA_SOURCE_ID: ${{ secrets.CLEANING_NOTION_DATA_SOURCE_ID }}
      CLEANING_NOTION_TOKEN: ${{ secrets.CLEANING_NOTION_TOKEN }}
      COLLECTOR_API_KEY: ${{ secrets.COLLECTOR_API_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      GARBAGE_NOTION_DATA_SOURCE_ID: ${{ secrets.GARBAGE_NOTION_DATA_SOURCE_ID }}
      GARBAGE_NOTION_TOKEN: ${{ secrets.GARBAGE_NOTION_TOKEN }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      INTERNAL_CONTROL_API_KEY: ${{ secrets.INTERNAL_CONTROL_API_KEY }}
      LOGIN_WEBHOOK_URL: ${{ secrets.SIGNALY_LOGIN_WEBHOOK_URL }}
      NATURE_REMO_TOKEN: ${{ secrets.NATURE_REMO_TOKEN }}
      SENSOR_WEBHOOK_URL: ${{ secrets.SENSOR_WEBHOOK_URL }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
      APNS_ENVIRONMENT: ${{ secrets.APNS_ENVIRONMENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build Frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add Known Hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=no "${USERNAME}@${HOST}" "mkdir -p ${TARGET_DIR}/frontend/out"

          # 先に JS/CSS チャンクだけを送る（#450）。rsync は同じ階層のファイルを
          # サブディレクトリの中身より先に送るため、1回で送ると out/index.html と
          # out/version.json が out/_next/ より先に届く。その数秒に開くと、新しいHTML
          # （または更新を検知した自動リロード）がまだ無いチャンクを読みに行き、
          # 「Application error」の白い画面になる。古いチャンクは消さないので、
          # 先に置いても開いている古い画面は壊れない
          rsync -rlDz \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
            ./frontend/out/_next/ "${USERNAME}@${HOST}:${TARGET_DIR}/frontend/out/_next/"

          rsync -rlDvz \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/.next' \
            --exclude 'frontend/.env' \
            --exclude 'frontend-react/node_modules' \
            --exclude 'frontend-react/.env' \
            ./ "${USERNAME}@${HOST}:${TARGET_DIR}/"

      - name: Restart Backend Service
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          # Auth サーバー（/auth/v1/user）への問い合わせに使う公開キー（#724）。フロントと同じ値で秘密ではない。
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          # 白くまくん（AirCloud Home）のログイン情報。エアコンの操作にだけ使う（#213）。
          # 未設定なら操作機能が無効になるだけで、デプロイは通る。
          AIRCON_EMAIL: ${{ env.AIRCON_EMAIL }}
          AIRCON_PASSWORD: ${{ env.AIRCON_PASSWORD }}
          SENSOR_WEBHOOK_URL: ${{ env.SENSOR_WEBHOOK_URL }}
          # ログイン通知の宛先（全アプリ共通の1チャンネル。guchi-apps/signaly#192）。
          # 空でもデプロイは通り、通知だけが静かに止まる（backend/login_notify.py）。
          LOGIN_WEBHOOK_URL: ${{ env.LOGIN_WEBHOOK_URL }}
          GARBAGE_NOTION_TOKEN: ${{ env.GARBAGE_NOTION_TOKEN }}
          GARBAGE_NOTION_DATA_SOURCE_ID: ${{ env.GARBAGE_NOTION_DATA_SOURCE_ID }}
          # 次の掃除をNotionの Task データベースへ書き出すために使う（#259）。
          # 空でもデプロイは通り、掃除カードはそのまま動く（書き出しだけ止まる）。
          CLEANING_NOTION_TOKEN: ${{ env.CLEANING_NOTION_TOKEN }}
          CLEANING_NOTION_DATA_SOURCE_ID: ${{ env.CLEANING_NOTION_DATA_SOURCE_ID }}
          INTERNAL_API_KEY: ${{ env.INTERNAL_API_KEY }}
          # 照明などの操作専用のサーバー間トークン（#419）。空でもデプロイは通り、
          # 操作用の内部APIが常に503を返すだけ（backend/internal_auth.py）。
          INTERNAL_CONTROL_API_KEY: ${{ env.INTERNAL_CONTROL_API_KEY }}
          # issue-deck の共有トークンAPI（#525）。INTERNAL_API_KEY 等をここから取得する。
          # 空でもデプロイは通り、上の環境変数へフォールバックするだけ。
          SHARED_TOKEN_API_URL: ${{ env.SHARED_TOKEN_API_URL }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          NATURE_REMO_TOKEN: ${{ env.NATURE_REMO_TOKEN }}
          # PWAプッシュ通知（Web Push）用のVAPID鍵（#293）。空でもデプロイは通り、
          # push_notify.is_configured() が false のまま機能全体が無効になるだけ。
          VAPID_PRIVATE_KEY: ${{ env.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ env.VAPID_SUBJECT }}
          # iOSアプリ（ios/・#526）向けのAPNs通知（#527）。空でもデプロイは通り、
          # apns_notify.is_configured() が false のまま機能全体が無効になるだけ。
          APNS_AUTH_KEY: ${{ env.APNS_AUTH_KEY }}
          APNS_KEY_ID: ${{ env.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ env.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ env.APNS_BUNDLE_ID }}
          APNS_ENVIRONMENT: ${{ env.APNS_ENVIRONMENT }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          # サブPCの収集が消費電力の再取得（#711）の依頼取得・完了報告に使う専用トークン（#714）。
          # 空でもデプロイは通り、その2口が常に503を返すだけ（無認証へは落ちない）。
          COLLECTOR_API_KEY: ${{ env.COLLECTOR_API_KEY }}
          # マイグレーション専用ユーザー（DDL権限あり）。アプリ用ユーザーはCRUD権限しか
          # 持たず、テーブルを追加するマイグレーションが CREATE command denied で落ちる（#193）。
          DB_ADMIN_USER: ${{ env.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ env.DB_ADMIN_PASSWORD }}
        run: |
          b64() { printf '%s' "$1" | base64 -w 0; }
          SUPABASE_URL_B64=$(b64 "$SUPABASE_URL")
          SUPABASE_PUBLISHABLE_KEY_B64=$(b64 "$SUPABASE_PUBLISHABLE_KEY")
          AIRCON_EMAIL_B64=$(b64 "$AIRCON_EMAIL")
          AIRCON_PASSWORD_B64=$(b64 "$AIRCON_PASSWORD")
          SENSOR_WEBHOOK_URL_B64=$(b64 "$SENSOR_WEBHOOK_URL")
          LOGIN_WEBHOOK_URL_B64=$(b64 "$LOGIN_WEBHOOK_URL")
          GARBAGE_NOTION_TOKEN_B64=$(b64 "$GARBAGE_NOTION_TOKEN")
          GARBAGE_NOTION_DATA_SOURCE_ID_B64=$(b64 "$GARBAGE_NOTION_DATA_SOURCE_ID")
          CLEANING_NOTION_TOKEN_B64=$(b64 "$CLEANING_NOTION_TOKEN")
          CLEANING_NOTION_DATA_SOURCE_ID_B64=$(b64 "$CLEANING_NOTION_DATA_SOURCE_ID")
          INTERNAL_API_KEY_B64=$(b64 "$INTERNAL_API_KEY")
          INTERNAL_CONTROL_API_KEY_B64=$(b64 "$INTERNAL_CONTROL_API_KEY")
          SHARED_TOKEN_API_URL_B64=$(b64 "$SHARED_TOKEN_API_URL")
          SHARED_TOKEN_API_SECRET_B64=$(b64 "$SHARED_TOKEN_API_SECRET")
          NATURE_REMO_TOKEN_B64=$(b64 "$NATURE_REMO_TOKEN")
          VAPID_PRIVATE_KEY_B64=$(b64 "$VAPID_PRIVATE_KEY")
          VAPID_PUBLIC_KEY_B64=$(b64 "$VAPID_PUBLIC_KEY")
          VAPID_SUBJECT_B64=$(b64 "$VAPID_SUBJECT")
          APNS_AUTH_KEY_B64=$(b64 "$APNS_AUTH_KEY")
          APNS_KEY_ID_B64=$(b64 "$APNS_KEY_ID")
          APNS_TEAM_ID_B64=$(b64 "$APNS_TEAM_ID")
          APNS_BUNDLE_ID_B64=$(b64 "$APNS_BUNDLE_ID")
          APNS_ENVIRONMENT_B64=$(b64 "$APNS_ENVIRONMENT")
          DB_USER_B64=$(b64 "$DB_USER")
          DB_PASSWORD_B64=$(b64 "$DB_PASSWORD")
          DB_HOST_B64=$(b64 "$DB_HOST")
          DB_PORT_B64=$(b64 "$DB_PORT")
          DB_NAME_B64=$(b64 "$DB_NAME")
          COLLECTOR_API_KEY_B64=$(b64 "$COLLECTOR_API_KEY")
          DB_MOCK_B64=$(b64 "false")
          DB_ADMIN_USER_B64=$(b64 "$DB_ADMIN_USER")
          DB_ADMIN_PASSWORD_B64=$(b64 "$DB_ADMIN_PASSWORD")
          ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" bash -s << EOF
            set -e
            echo "Current directory: \$(pwd)"
            cd ${TARGET_DIR}
            echo "Working directory: \$(pwd)"

            sync_env_var() {
              key="\$1"
              value="\$(printf '%s' "\$2" | base64 -d)"
              touch .env
              if grep -q "^\${key}=" .env; then
                grep -v "^\${key}=" .env > .env.tmp && mv .env.tmp .env
              fi
              printf '%s=%s\n' "\$key" "\$value" >> .env
            }

            sync_env_var SUPABASE_URL '${SUPABASE_URL_B64}'
            sync_env_var SUPABASE_PUBLISHABLE_KEY '${SUPABASE_PUBLISHABLE_KEY_B64}'
            sync_env_var AIRCON_EMAIL '${AIRCON_EMAIL_B64}'
            sync_env_var AIRCON_PASSWORD '${AIRCON_PASSWORD_B64}'
            sync_env_var SENSOR_WEBHOOK_URL '${SENSOR_WEBHOOK_URL_B64}'
            sync_env_var LOGIN_WEBHOOK_URL '${LOGIN_WEBHOOK_URL_B64}'
            sync_env_var GARBAGE_NOTION_TOKEN '${GARBAGE_NOTION_TOKEN_B64}'
            sync_env_var GARBAGE_NOTION_DATA_SOURCE_ID '${GARBAGE_NOTION_DATA_SOURCE_ID_B64}'
            sync_env_var CLEANING_NOTION_TOKEN '${CLEANING_NOTION_TOKEN_B64}'
            sync_env_var CLEANING_NOTION_DATA_SOURCE_ID '${CLEANING_NOTION_DATA_SOURCE_ID_B64}'
            sync_env_var INTERNAL_API_KEY '${INTERNAL_API_KEY_B64}'
            sync_env_var INTERNAL_CONTROL_API_KEY '${INTERNAL_CONTROL_API_KEY_B64}'
            sync_env_var SHARED_TOKEN_API_URL '${SHARED_TOKEN_API_URL_B64}'
            sync_env_var SHARED_TOKEN_API_SECRET '${SHARED_TOKEN_API_SECRET_B64}'
            sync_env_var NATURE_REMO_TOKEN '${NATURE_REMO_TOKEN_B64}'
            sync_env_var VAPID_PRIVATE_KEY '${VAPID_PRIVATE_KEY_B64}'
            sync_env_var VAPID_PUBLIC_KEY '${VAPID_PUBLIC_KEY_B64}'
            sync_env_var VAPID_SUBJECT '${VAPID_SUBJECT_B64}'
            sync_env_var APNS_AUTH_KEY '${APNS_AUTH_KEY_B64}'
            sync_env_var APNS_KEY_ID '${APNS_KEY_ID_B64}'
            sync_env_var APNS_TEAM_ID '${APNS_TEAM_ID_B64}'
            sync_env_var APNS_BUNDLE_ID '${APNS_BUNDLE_ID_B64}'
            sync_env_var APNS_ENVIRONMENT '${APNS_ENVIRONMENT_B64}'
            sync_env_var DB_USER '${DB_USER_B64}'
            sync_env_var DB_PASSWORD '${DB_PASSWORD_B64}'
            sync_env_var DB_HOST '${DB_HOST_B64}'
            sync_env_var DB_PORT '${DB_PORT_B64}'
            sync_env_var DB_NAME '${DB_NAME_B64}'
            sync_env_var COLLECTOR_API_KEY '${COLLECTOR_API_KEY_B64}'
            sync_env_var DB_MOCK '${DB_MOCK_B64}'

            bash deployment/ensure_venv.sh

            echo "Ensuring pip is installed..."
            ./venv/bin/python3 -m ensurepip || true

            if ! ./venv/bin/python3 -m pip --version > /dev/null 2>&1; then
                echo "Downloading get-pip.py..."
                curl -sS https://bootstrap.pypa.io/get-pip.py | ./venv/bin/python3
            fi

            echo "Installing dependencies..."
            ./venv/bin/python3 -m pip install --upgrade pip
            ./venv/bin/python3 -m pip install -r requirements.txt

            if [ -f "migrate_db.py" ]; then
                echo "Running migrations..."
                # DDLはマイグレーション専用ユーザーで実行する。常時稼働するバックエンドには
                # DDL権限を渡さないため、.env には書かずこの1コマンドの間だけ環境変数で渡す。
                # 値が空ならmigrate_db.py側でアプリ用ユーザーにフォールバックする。
                DB_ADMIN_USER="\$(printf '%s' '${DB_ADMIN_USER_B64}' | base64 -d)" \\
                DB_ADMIN_PASSWORD="\$(printf '%s' '${DB_ADMIN_PASSWORD_B64}' | base64 -d)" \\
                ./venv/bin/python3 migrate_db.py
            fi

            echo "Managing PM2 process..."
            pm2 delete myroom-backend 2>/dev/null || true
            pm2 delete insight-backend 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            # 起動できたかを確認してからデプロイを成功にする。固定のsleep 1回だと、
            # 起動が間に合わないだけで赤くなる／即死していても緑で終わる（#205）。
            # 2秒間隔で最大30回（60秒）待つ。
            echo "Health check..."
            for i in \$(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:8000/api/health"; then
                echo "Deployment successful."
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after 60s."
            pm2 describe myroom-backend || true
            pm2 logs myroom-backend --lines 50 --nostream || true
            exit 1
          EOF

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: kurashio
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: deploy
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: kurashio
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
          NOTIFY_JOB: release
        run: bash .github/scripts/signaly-notify.sh
