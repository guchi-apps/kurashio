name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump frontend/package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    # SSH_PRIVATE_KEY はorganization共通の SERVER_SSH_PRIVATE_KEY ではなく、このアプリ専用の鍵（#803）。
    # TARGET_DIR は app-deploy-gate が置き場を固定するため使わなくなった。
    env:
      DB_ADMIN_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_ADMIN_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      HOST: ${{ secrets.SERVER_HOST }}
      SHARED_TOKEN_API_URL: ${{ vars.APP_BASE_URL }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      AIRCON_EMAIL: ${{ secrets.AIRCON_EMAIL }}
      AIRCON_PASSWORD: ${{ secrets.AIRCON_PASSWORD }}
      CLEANING_NOTION_DATA_SOURCE_ID: ${{ secrets.CLEANING_NOTION_DATA_SOURCE_ID }}
      CLEANING_NOTION_TOKEN: ${{ secrets.CLEANING_NOTION_TOKEN }}
      COLLECTOR_API_KEY: ${{ secrets.COLLECTOR_API_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      GARBAGE_NOTION_DATA_SOURCE_ID: ${{ secrets.GARBAGE_NOTION_DATA_SOURCE_ID }}
      GARBAGE_NOTION_TOKEN: ${{ secrets.GARBAGE_NOTION_TOKEN }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      INTERNAL_CONTROL_API_KEY: ${{ secrets.INTERNAL_CONTROL_API_KEY }}
      LOGIN_WEBHOOK_URL: ${{ secrets.SIGNALY_LOGIN_WEBHOOK_URL }}
      NATURE_REMO_TOKEN: ${{ secrets.NATURE_REMO_TOKEN }}
      SENSOR_WEBHOOK_URL: ${{ secrets.SENSOR_WEBHOOK_URL }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
      APNS_ENVIRONMENT: ${{ secrets.APNS_ENVIRONMENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build Frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build

      # 配布物（tar.gz）を作る。以前の rsync と同じものを除外する（.git・.github・.env・venv・
      # __pycache__・*.pyc・frontend の node_modules / .next / .env）。
      #
      # **frontend/out/_next/ を先頭に格納する（#450）。** tar は格納順に展開するため、こうすると
      # out/index.html・out/version.json より先にJS/CSSのチャンクが置かれる。逆だと、その数秒に開いた
      # 画面（更新検知の自動リロードを含む）がまだ無いチャンクを読みに行き「Application error」になる。
      # frontend/out/ は deploy/gate-keep で前回配布物の削除から外し、上書きする（以前の rsync と同じ）。
      # 古いチャンクが残って開いたままの古い画面を壊さず、前回の HTML を先に消さないのでページが無い時間もできない。
      #
      # app-deploy-gate はシンボリックリンク・特殊ファイルを含む配布物を拒否するため、ここでも確かめる。
      - name: Build deploy archive
        run: |
          set -euo pipefail
          test -d frontend/out/_next
          archive="${RUNNER_TEMP}/deploy.tar"
          rm -f "$archive" "${archive}.gz"
          tar -cf "$archive" frontend/out/_next
          tar -rf "$archive" \
            --exclude='./frontend/out/_next' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.next' \
            --exclude='frontend/.env' \
            --exclude='frontend-react/node_modules' \
            --exclude='frontend-react/.env' \
            .
          gzip -n "$archive"
          # head や grep -q で途中から読むのをやめると、pipefail のもとで tar が SIGPIPE で落ちる。
          # 一覧は最後まで読んでから判定する。
          bad="$(tar -tvzf "${archive}.gz" | awk '$1 !~ /^[-d]/')"
          if [ -n "$bad" ]; then
            echo "::error::配布物にシンボリックリンクまたは特殊ファイルが含まれています（app-deploy-gate が拒否します）"
            printf '%s\n' "$bad"
            exit 1
          fi
          first="$(tar -tzf "${archive}.gz" | awk 'NR == 1')"
          case "$first" in
            frontend/out/_next*) ;;
            *) echo "::error::配布物の先頭が frontend/out/_next ではありません（${first}）"; exit 1 ;;
          esac
          echo "DEPLOY_ARCHIVE=${archive}.gz" >> "$GITHUB_ENV"
          ls -l "${archive}.gz"

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add Known Hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#305）へ渡す**（#803）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名（myroom。置き場
      # /home/github-user/apps/myroom）を固定する。任意のシェルコマンドは実行できず、upload・env・deployの
      # 3語だけが通る。旧配布物の削除（deploy/gate-keep に書いた frontend/out/ は除く）・展開・.env更新はgateが行い、
      # venv・pip install・migrate_db.py・pm2 の再起動は配布物の deploy/gate-install.sh が行う。
      # 稼働版の照合（.env の APP_COMMIT_SHA と 127.0.0.1:8000/api/app-version の sha）もgateが行う。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < "${DEPLOY_ARCHIVE}"

      - name: Send environment variables
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          # Auth サーバー（/auth/v1/user）への問い合わせに使う公開キー（#724）。フロントと同じ値で秘密ではない。
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          # 白くまくん（AirCloud Home）のログイン情報。エアコンの操作にだけ使う（#213）。
          # 未設定なら操作機能が無効になるだけで、デプロイは通る。
          AIRCON_EMAIL: ${{ env.AIRCON_EMAIL }}
          AIRCON_PASSWORD: ${{ env.AIRCON_PASSWORD }}
          SENSOR_WEBHOOK_URL: ${{ env.SENSOR_WEBHOOK_URL }}
          # ログイン通知の宛先（全アプリ共通の1チャンネル。guchi-apps/signaly#192）。
          # 空でもデプロイは通り、通知だけが静かに止まる（backend/login_notify.py）。
          LOGIN_WEBHOOK_URL: ${{ env.LOGIN_WEBHOOK_URL }}
          GARBAGE_NOTION_TOKEN: ${{ env.GARBAGE_NOTION_TOKEN }}
          GARBAGE_NOTION_DATA_SOURCE_ID: ${{ env.GARBAGE_NOTION_DATA_SOURCE_ID }}
          # 次の掃除をNotionの Task データベースへ書き出すために使う（#259）。
          # 空でもデプロイは通り、掃除カードはそのまま動く（書き出しだけ止まる）。
          CLEANING_NOTION_TOKEN: ${{ env.CLEANING_NOTION_TOKEN }}
          CLEANING_NOTION_DATA_SOURCE_ID: ${{ env.CLEANING_NOTION_DATA_SOURCE_ID }}
          INTERNAL_API_KEY: ${{ env.INTERNAL_API_KEY }}
          # 照明などの操作専用のサーバー間トークン（#419）。空でもデプロイは通り、
          # 操作用の内部APIが常に503を返すだけ（backend/internal_auth.py）。
          INTERNAL_CONTROL_API_KEY: ${{ env.INTERNAL_CONTROL_API_KEY }}
          # issue-deck の共有トークンAPI（#525）。INTERNAL_API_KEY 等をここから取得する。
          # 空でもデプロイは通り、上の環境変数へフォールバックするだけ。
          SHARED_TOKEN_API_URL: ${{ env.SHARED_TOKEN_API_URL }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          NATURE_REMO_TOKEN: ${{ env.NATURE_REMO_TOKEN }}
          # PWAプッシュ通知（Web Push）用のVAPID鍵（#293）。空でもデプロイは通り、
          # push_notify.is_configured() が false のまま機能全体が無効になるだけ。
          VAPID_PRIVATE_KEY: ${{ env.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ env.VAPID_SUBJECT }}
          # iOSアプリ（ios/・#526）向けのAPNs通知（#527）。空でもデプロイは通り、
          # apns_notify.is_configured() が false のまま機能全体が無効になるだけ。
          # APNS_AUTH_KEY は .p8 の中身を base64 で1行にした値（apns_notify._auth_key_pem() が戻す）。
          APNS_AUTH_KEY: ${{ env.APNS_AUTH_KEY }}
          APNS_KEY_ID: ${{ env.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ env.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ env.APNS_BUNDLE_ID }}
          APNS_ENVIRONMENT: ${{ env.APNS_ENVIRONMENT }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          # サブPCの収集が消費電力の再取得（#711）の依頼取得・完了報告に使う専用トークン（#714）。
          # 空でもデプロイは通り、その2口が常に503を返すだけ（無認証へは落ちない）。
          COLLECTOR_API_KEY: ${{ env.COLLECTOR_API_KEY }}
          # マイグレーション専用ユーザー（DDL権限あり）。アプリ用ユーザーはCRUD権限しか
          # 持たず、テーブルを追加するマイグレーションが CREATE command denied で落ちる（#193）。
          # .env へは書かず、MIGRATE_DATABASE_URL に組み立てて送る（gateは .env へ書かずに
          # deploy/gate-install.sh へだけ渡す）。
          DB_ADMIN_USER: ${{ env.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ env.DB_ADMIN_PASSWORD }}
          # デプロイしたコミット（#798）。.env へ書いてバックエンドの /api/app-version が返し、
          # gate が稼働版がこのコミットと一致するまで成功にしない（guchi-apps/vps#298）。
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$APP_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::APP_COMMIT_SHA が40桁のコミットSHAではありません: '${APP_COMMIT_SHA}'"
            exit 1
          fi
          # マイグレーション専用ユーザーの接続先。ユーザー・パスワードはURLエンコードして埋める
          # （deploy/gate-install.sh がデコードする）。専用ユーザーが未設定なら空のまま送り、
          # 従来どおり migrate_db.py がアプリ用ユーザーへフォールバックする。
          MIGRATE_DATABASE_URL=""
          if [ -n "${DB_ADMIN_USER}" ]; then
            enc() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
            MIGRATE_DATABASE_URL="mysql://$(enc "$DB_ADMIN_USER"):$(enc "$DB_ADMIN_PASSWORD")@${DB_HOST}:${DB_PORT}/${DB_NAME}"
          fi
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない。
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY AIRCON_EMAIL AIRCON_PASSWORD SENSOR_WEBHOOK_URL \
            LOGIN_WEBHOOK_URL GARBAGE_NOTION_TOKEN GARBAGE_NOTION_DATA_SOURCE_ID CLEANING_NOTION_TOKEN \
            CLEANING_NOTION_DATA_SOURCE_ID INTERNAL_API_KEY INTERNAL_CONTROL_API_KEY SHARED_TOKEN_API_URL \
            SHARED_TOKEN_API_SECRET NATURE_REMO_TOKEN VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT \
            APNS_AUTH_KEY APNS_KEY_ID APNS_TEAM_ID APNS_BUNDLE_ID APNS_ENVIRONMENT DB_USER DB_PASSWORD \
            DB_HOST DB_PORT DB_NAME COLLECTOR_API_KEY MIGRATE_DATABASE_URL APP_COMMIT_SHA; do
            case "${!name}" in
              *$'\n'*|*$'\r'*) echo "::error::${name} が改行を含むためgateへ送れません（1行の値にしてください）"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ（ecosystem.config.js の 8000 と同じ）。
          # gate は PORT を必須にし、稼働版の照合で 127.0.0.1:<PORT>/api/app-version を叩く。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=8000"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}"
            printf '%s\n' "SUPABASE_URL=${SUPABASE_URL}"
            printf '%s\n' "SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}"
            printf '%s\n' "AIRCON_EMAIL=${AIRCON_EMAIL}"
            printf '%s\n' "AIRCON_PASSWORD=${AIRCON_PASSWORD}"
            printf '%s\n' "SENSOR_WEBHOOK_URL=${SENSOR_WEBHOOK_URL}"
            printf '%s\n' "LOGIN_WEBHOOK_URL=${LOGIN_WEBHOOK_URL}"
            printf '%s\n' "GARBAGE_NOTION_TOKEN=${GARBAGE_NOTION_TOKEN}"
            printf '%s\n' "GARBAGE_NOTION_DATA_SOURCE_ID=${GARBAGE_NOTION_DATA_SOURCE_ID}"
            printf '%s\n' "CLEANING_NOTION_TOKEN=${CLEANING_NOTION_TOKEN}"
            printf '%s\n' "CLEANING_NOTION_DATA_SOURCE_ID=${CLEANING_NOTION_DATA_SOURCE_ID}"
            printf '%s\n' "INTERNAL_API_KEY=${INTERNAL_API_KEY}"
            printf '%s\n' "INTERNAL_CONTROL_API_KEY=${INTERNAL_CONTROL_API_KEY}"
            printf '%s\n' "SHARED_TOKEN_API_URL=${SHARED_TOKEN_API_URL}"
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET}"
            printf '%s\n' "NATURE_REMO_TOKEN=${NATURE_REMO_TOKEN}"
            printf '%s\n' "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
            printf '%s\n' "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            printf '%s\n' "VAPID_SUBJECT=${VAPID_SUBJECT}"
            printf '%s\n' "APNS_AUTH_KEY=${APNS_AUTH_KEY}"
            printf '%s\n' "APNS_KEY_ID=${APNS_KEY_ID}"
            printf '%s\n' "APNS_TEAM_ID=${APNS_TEAM_ID}"
            printf '%s\n' "APNS_BUNDLE_ID=${APNS_BUNDLE_ID}"
            printf '%s\n' "APNS_ENVIRONMENT=${APNS_ENVIRONMENT}"
            printf '%s\n' "DB_USER=${DB_USER}"
            printf '%s\n' "DB_PASSWORD=${DB_PASSWORD}"
            printf '%s\n' "DB_HOST=${DB_HOST}"
            printf '%s\n' "DB_PORT=${DB_PORT}"
            printf '%s\n' "DB_NAME=${DB_NAME}"
            printf '%s\n' "COLLECTOR_API_KEY=${COLLECTOR_API_KEY}"
            # 本番は常に実DB（.env に固定で書く）
            printf '%s\n' "DB_MOCK=false"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: kurashio
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: deploy
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: kurashio
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
          NOTIFY_JOB: release
        run: bash .github/scripts/signaly-notify.sh
