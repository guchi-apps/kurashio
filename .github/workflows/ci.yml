name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest tests/ -q
        env:
          DB_MOCK: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # iOSの殻（ios/）とWeb側で揃えておく値の照合（#568）。依存もビルドも要らないので
      # npm ci の前に、条件を付けず毎回実行する（照合相手の一方は frontend/ 側にあり、
      # ios/ を触らないPRでもずれる）。別ジョブにすると notify の判定から漏れるため、ここに置く。
      - name: Check iOS consistency
        run: node ios/scripts/check-consistency.mjs

      # TestFlight配布の判定・App Store Connect APIの純関数のテスト（#591）。依存なし
      - name: Test iOS distribution scripts
        run: node --test ios/scripts/*.test.mjs

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
