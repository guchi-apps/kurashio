name: Claude Issue Dispatch

# Issueへの`@claude`コメントを起点に、計画提示・実装・develop向けPR作成までをGitHub Actions上で
# 無人実行するワークフローの、myroom側のトリガー定義。
#
# ジョブ本体はguchi-apps/issue-deckのreusable-issue-dispatch.ymlにあり、ここでは`uses:`で参照する
# だけにしている。技術スタックの差はwith:のinputsで吸収する。
#
# `uses:`のタグと`prompts-ref`は必ず同じ値にする。`uses:`だけ上げるとプロンプト
# (.github/prompts/配下)が古いタグのまま参照され、新しいワークフローで古いプロンプトが動く。
# なお`prompts-ref`を空にすると呼び出し元(このリポジトリ)の.github/prompts/を読みに行き、
# myroomはそれを持たないため最初のClaudeステップで落ちる。
#
# 動作の詳細(21.plan-requiredの二段階トリガー、mode=ask/plan/split/implement/additionalの
# 判定、11.localによる二重起動防止など)は、issue-deckのdocs/multi-agent/dispatch.mdを参照する。
on:
  issues:
    types: [unlabeled]
  issue_comment:
    types: [created]
  # 計画/実装のフォールバック検証ステップ専用の自己リトライ起動経路。
  # issue_number/retry_attemptはgh workflow runから渡される想定だが、人間が直接手動実行してもよい。
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象issue番号"
        required: true
        type: string
      retry_attempt:
        description: "これまでの自動リトライ回数(0始まり。指定した回数の次の試行として実行する)"
        required: false
        type: string
        default: "0"

jobs:
  dispatch:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-issue-dispatch.yml@workflows/v47
    with:
      # 準備ステップは全てリポジトリルートで動くが、myroomのルートpackage.jsonは
      # バージョン管理用のscriptだけで依存を持たず、package-lock.jsonも空のスタブ
      # （"packages": {}）のため、node にしても意味のあるインストールにならない。
      # 実際の依存はfrontend/にあり、そこへ入るのは実装エージェント自身の仕事。
      runtime-setup: minimal
      # frontend/ が npm。minimal では準備ステップに使われないが、実装ステップの
      # 許可ツールの出し分け（issue-deck#1147）がこの値を見るため、正しく npm にする。
      # pnpm にすると npm・node が許可されず frontend/ の検証ができなくなる。
      package-manager: npm
      # 実装ステップのNodeをCI(.github/workflows/ci.yml)のfrontendジョブと揃える。
      # runtime-setup とは独立した軸で、cache: を付けずに setup-node を呼ぶだけ。
      #
      # **Pythonのバージョンは指定できない。** バックエンドはCIがsetup-pythonで3.11に
      # 固定しているが、共有ワークフローにPythonのプリセットは無く、実装ステップは
      # ランナー標準のPythonを使う（許可ツールとしてpython・pip・pytestは通る）。
      node-version: "20"
      # uses: のタグと必ず同じ値にする。
      prompts-ref: workflows/v47
    # CLAUDE_CODE_OAUTH_TOKEN・WORKFLOW_PATを呼ばれる側へ渡す。
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
